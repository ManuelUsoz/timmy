@let model = state.model();
<div class="backdrop" aria-hidden="true" (click)="state.close()"></div>
<div #dialog class="dialog" role="dialog" aria-modal="true" tabindex="-1" [attr.aria-label]="i18n.t('quickLook.label', { name: name() })" (keydown)="key($event)">
  <header class="head">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h5l3 3v9H4zM9 2v3h3" /></svg>
    <span class="name">{{ name() }}</span>
    @if (dir() !== '') {
      <span class="dir">{{ dir() }}</span>
    }
    <span class="grow"></span>
    <span class="counter" aria-live="polite">{{ counter() }}</span>
    <button type="button" class="close" [attr.aria-label]="i18n.t('quickLook.close')" (click)="state.close()">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
    </button>
  </header>

  @if (model) {
    <app-file-view class="body" [cwd]="model.cwd" [path]="path()" />
  }

  <div class="hints" aria-hidden="true">
    <span><kbd>↑</kbd><kbd>↓</kbd> {{ i18n.t('quickLook.walk') }}</span>
    <span><kbd>Enter</kbd> {{ i18n.t('quickLook.open') }}</span>
    <span class="grow"></span>
    <span><kbd>Esc</kbd> {{ i18n.t('quickLook.dismiss') }}</span>
  </div>
</div>
