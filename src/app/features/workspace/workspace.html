<app-workspace-sidebar />
<main class="screen">
  <router-outlet />
</main>
@if (files.open() && projects.selected()) {
  <app-files-sidebar />
}
@if (settingsDialog.open()) {
  <app-settings-dialog />
}
<app-toast-host />
@if (projects.creating()) {
  <app-new-project-dialog (closed)="projects.creating.set(false)" (created)="created($event)" />
}
@if (switcher.model()) {
  <app-switcher />
}
