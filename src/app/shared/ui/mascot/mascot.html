<svg viewBox="0 0 128 128" [attr.width]="size()" [attr.height]="size()" aria-hidden="true">
  <g class="b">
    <path
      class="body"
      d="M64 114C42 114 28 98 28 80C28 62 32 46 44 32C47 40 52 46 57 54C58 36 66 20 72 8C80 28 100 48 100 80C100 98 86 114 64 114Z"
    />
    <g class="gaze">
      @switch (status()) {
        @case ('Error') {
          <g class="eyes" fill="none" stroke="var(--text-on-color)" stroke-width="2.6" stroke-dasharray="14 24" stroke-linecap="round">
            <circle class="ring" cx="51" cy="70" r="6" />
            <circle class="ring" cx="77" cy="70" r="6" />
          </g>
        }
        @case ('Done') {
          <g class="eyes" fill="none" stroke="var(--text-on-color)" stroke-width="3.5" stroke-linecap="round">
            <path d="M46 73Q51 63 56 73" />
            <path d="M72 73Q77 63 82 73" />
          </g>
        }
        @default {
          <g class="eyes" fill="var(--text-on-color)">
            <rect class="e" x="47" y="62" width="8" height="16" rx="4" />
            <rect class="e" x="73" y="62" width="8" height="16" rx="4" />
          </g>
        }
      }
    </g>
  </g>
  <!-- Keyed by the stroke, so each stroke draws a fresh court and its animations play from the start. -->
  @for (stroke of court(); track stroke) {
    <!-- Drawn for a forehand, on the Mascot's right; a backhand mirrors it to the left. -->
    <g class="court">
      <g class="racket" fill="none" stroke="var(--text-primary)" stroke-linecap="round">
        <ellipse cx="112" cy="62" rx="10" ry="13" stroke-width="3" />
        <path d="M107 55L117 69M117 55L107 69" stroke-width="1" />
        <path d="M110 75L106 96" stroke-width="4" />
      </g>
      <circle class="ball" cx="118" cy="54" r="4.5" fill="var(--support-warning)" />
    </g>
  }
</svg>
