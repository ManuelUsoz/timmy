<ng-content />
@if (loading()) {
  <div class="status" role="status">
    <svg class="spinner" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor"
      stroke-width="2" aria-hidden="true">
      <circle cx="8" cy="8" r="6" opacity="0.3" />
      <path d="M8 2a6 6 0 0 1 6 6" />
    </svg>
    {{ loadingLabel() }}
  </div>
} @else if (isEmpty()) {
  <div class="status empty">{{ emptyLabel() }}</div>
}
@if (createLabel(); as label) {
  <div
    class="create"
    role="option"
    aria-selected="false"
    tabindex="-1"
    [id]="createId"
    [attr.data-active]="createActive() ? '' : null"
    (click)="create.emit()"
  >
    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"
      aria-hidden="true">
      <path d="M8 3v10M3 8h10" />
    </svg>
    {{ label }}
  </div>
}
