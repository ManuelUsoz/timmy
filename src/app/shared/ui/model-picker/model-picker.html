<button
  #trigger
  type="button"
  class="mp-trigger"
  aria-haspopup="dialog"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="popoverId"
  [attr.aria-label]="summary()"
  [disabled]="disabled()"
  (click)="toggle()"
>
  <span class="mp-model">{{ modelText() }}</span>
  <span class="mp-bars" aria-hidden="true">
    @for (e of scale(); track e.value; let i = $index) {
      <i [class.mp-on]="i < filled()" [style.height.px]="barHeight(i)"></i>
    }
  </span>
  <span class="mp-code">{{ effortText() }}</span>
  <svg class="mp-chev" [class.mp-chev--open]="open()" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 6l4 4 4-4" />
  </svg>
</button>

@if (open()) {
  <div class="mp-pop" role="dialog" [id]="popoverId" [attr.aria-label]="modelsLabel() + ' / ' + effortLabel()">
    <div class="mp-label">{{ modelsLabel() }}</div>
    <div role="radiogroup" [attr.aria-label]="modelsLabel()">
      <button type="button" class="mp-opt" role="radio" [attr.aria-checked]="model() === null" (click)="pickModel(null)">
        <svg class="mp-ck" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          @if (model() === null) {
            <path d="M3 8.5l3.5 3.5L13 4.5" />
          }
        </svg>
        {{ defaultModelLabel() }}
      </button>
      @for (m of models(); track m.value) {
        <button type="button" class="mp-opt" role="radio" [attr.aria-checked]="model() === m.value" (click)="pickModel(m.value)">
          <svg class="mp-ck" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            @if (model() === m.value) {
              <path d="M3 8.5l3.5 3.5L13 4.5" />
            }
          </svg>
          {{ m.label }}
        </button>
      }
    </div>
    @if (scale().length > 0) {
      <div class="mp-rule"></div>
      <div class="mp-label">
        {{ effortLabel() }}<b>{{ effortText() }}</b>
      </div>
      <div class="mp-scale">
        <div class="mp-scale-bar" role="radiogroup" [attr.aria-label]="effortLabel()">
          @for (e of scale(); track e.value; let i = $index) {
            <button
              type="button"
              role="radio"
              [class.mp-on]="i < filled()"
              [attr.aria-checked]="e.value === effort()"
              [attr.aria-label]="e.label"
              (click)="pickEffort(e.value)"
            ></button>
          }
        </div>
        @if (lowLabel() || highLabel()) {
          <div class="mp-scale-lab"><span>{{ lowLabel() }}</span><span>{{ highLabel() }}</span></div>
        }
      </div>
    }
  </div>
}
