appId: com.timmy.app
productName: Timmy
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - dist/renderer/**/*
  - package.json
  # The renderer is bundled by Angular/esbuild; node-pty is the one native runtime dependency.
  - '!node_modules/**/*'
  - node_modules/node-pty/**
asarUnpack:
  - node_modules/node-pty/**
asar: true
npmRebuild: false
win:
  icon: docs/assets/img/icon.ico
  target:
    - nsis
mac:
  icon: docs/assets/img/icon.icns
  target:
    - dmg
linux:
  icon: docs/assets/img/icon.png
  target:
    - AppImage
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
